<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">ORION-GRID</title>
  <desc id="d">Decentralized P2P compute cluster for autonomous AI agents. Zero-dependency infrastructure.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9aa0a8" stroke-width="0.6" opacity="0.16"/>
    </pattern>
    <pattern id="grid4" width="128" height="128" patternUnits="userSpaceOnUse">
      <path d="M128 0H0V128" fill="none" stroke="#c9ced6" stroke-width="1" opacity="0.28"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0a0a0c" stop-opacity="0.96"/>
      <stop offset="0.55" stop-color="#0a0a0c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0a0a0c" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#8d939c"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#b44dff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b44dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="#0a0a0c"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#grid4)"/>
  <circle cx="930" cy="150" r="260" fill="url(#halo)" opacity="0.35"/>

  <!-- network edges -->
  <g stroke="#a855f7" stroke-width="1.4" opacity="0.7" fill="none">
    <path d="M700 70L820 120L930 60L1060 110L1180 70"/>
    <path d="M820 120L760 230L900 250L1010 200L1060 110"/>
    <path d="M930 60L900 160L1010 200L1130 240L1180 160L1060 110"/>
    <path d="M900 160L820 120M900 160L760 230M900 160L900 250M1180 160L1180 70M1130 240L1010 200"/>
    <path d="M700 70L760 230" opacity="0.45"/>
    <path d="M1180 70L1240 130L1180 160" opacity="0.5"/>
  </g>
  <g stroke="#c9ced6" stroke-width="0.8" opacity="0.35" stroke-dasharray="3 5" fill="none">
    <path d="M700 70L900 160L1180 70M760 230L1130 240M820 120L1010 200L1180 70"/>
  </g>

  <!-- nodes -->
  <g fill="#c084fc" filter="url(#glow)">
    <circle cx="700" cy="70" r="5"/><circle cx="820" cy="120" r="6"/>
    <circle cx="930" cy="60" r="5"/><circle cx="1060" cy="110" r="7"/>
    <circle cx="1180" cy="70" r="5"/><circle cx="760" cy="230" r="5"/>
    <circle cx="900" cy="250" r="5"/><circle cx="1010" cy="200" r="6"/>
    <circle cx="1130" cy="240" r="5"/><circle cx="1180" cy="160" r="6"/>
    <circle cx="1240" cy="130" r="4"/>
  </g>
  <!-- central hub: hexagon -->
  <g filter="url(#glow)">
    <polygon points="900,138 920,149 920,171 900,182 880,171 880,149" fill="#0a0a0c" stroke="#d8b4fe" stroke-width="2"/>
    <circle cx="900" cy="160" r="5" fill="#e9d5ff"/>
  </g>

  <!-- text legibility scrim -->
  <rect width="760" height="320" fill="url(#fade)"/>

  <!-- frame corners -->
  <g stroke="#c9ced6" stroke-width="1.5" fill="none" opacity="0.7">
    <path d="M24 56V24H56"/><path d="M1224 24H1256V56"/>
    <path d="M24 264V296H56"/><path d="M1224 296H1256V264"/>
  </g>

  <g font-family="'JetBrains Mono','SF Mono','IBM Plex Mono',Menlo,Consolas,'Liberation Mono',monospace">
    <text x="64" y="88" font-size="13" fill="#a855f7" letter-spacing="4">// P2P · COMPUTE · SOVEREIGN</text>
    <text x="60" y="168" font-size="76" font-weight="700" fill="url(#steel)" letter-spacing="6">ORION-GRID</text>
    <rect x="64" y="190" width="120" height="3" fill="#a855f7"/>
    <text x="64" y="226" font-size="17" fill="#b9bec6">Decentralized P2P compute cluster for autonomous AI agents.</text>
    <text x="64" y="252" font-size="17" fill="#b9bec6">Zero-dependency infrastructure.</text>
    <text x="64" y="288" font-size="12" fill="#6b7078" letter-spacing="2">ONE FILE  ·  ZERO DEPENDENCIES  ·  ABSOLUTE SYSTEM SOVEREIGNTY</text>
  </g>
</svg>
